<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Noemy owo 🌻</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Three.js Import Shim & Map -->
    <script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.179.1/build/three.module.js"
        }
    }
    </script>

    <!-- CSS Unificado y Responsivo -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02030a;
            color: white;
            font-family: "Poppins", sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #overlay {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            padding: 20px;
        }

        #welcome {
            width: 100%;
            max-width: 700px;
            text-align: center;
            transition: 1s ease;
            padding: 0 15px;
        }

        #welcome h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(2.2rem, 8vw, 4.5rem);
            font-weight: 600;
            margin-bottom: 20px;
            text-shadow: 0 0 25px rgba(255, 255, 255, .35);
        }

        #welcome p {
            max-width: 550px;
            margin: auto;
            margin-bottom: 30px;
            font-size: clamp(0.95rem, 3.5vw, 1.15rem);
            line-height: 1.6;
            color: #dddddd;
        }

        button {
            border: none;
            cursor: pointer;
            padding: 14px 35px;
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffd54f, #ff9800);
            box-shadow: 0 0 35px rgba(255, 190, 0, .45);
            transition: .35s;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 0 70px rgba(255, 200, 0, .7);
        }

        button:active {
            transform: scale(.95);
        }

        #letterBox {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: 1s ease;
            padding: 15px;
        }

        .card {
            width: 100%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            padding: clamp(20px, 5vw, 45px);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .15);
            box-shadow: 0 0 50px rgba(0, 0, 0, .6);
            text-align: center;
        }

        .card h2 {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            margin-bottom: 20px;
        }

        #letterText {
            min-height: 180px;
            text-align: left;
            white-space: pre-line;
            font-size: clamp(0.9rem, 3vw, 1.05rem);
            line-height: 1.8;
            color: #eeeeee;
            margin-bottom: 20px;
        }

        .showLetter {
            opacity: 1 !important;
            visibility: visible !important;
        }

        .hideWelcome {
            opacity: 0;
            transform: translateY(-50px);
            pointer-events: none;
        }
    </style>
</head>

<body>

    <canvas id="bg"></canvas>

    <div id="overlay">
        <section id="welcome">
            <h1>Para una futura gran maestra</h1>
            <p>Un pequeño detalle para recordarte que los sueños se construyen paso a paso.</p>
            <button id="startButton">Comenzar ✨</button>
        </section>

        <section id="letterBox">
            <div class="card">
                <h2>Para una futura maestra con mucho corazón</h2>
                <p id="letterText"></p>
                <button id="finishButton">Gracias por leer 🌻</button>
            </div>
        </section>
    </div>

    <!-- JavaScript Unificado -->
    <script type="module">
        import * as THREE from "three";

        const canvas = document.querySelector("#bg");
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x02030a);

        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 18;

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const light = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(light);

        const flowerLight = new THREE.PointLight(0xffd27a, 35, 100);
        flowerLight.position.set(0, 5, 5);
        scene.add(flowerLight);

        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = window.innerWidth < 768 ? 1500 : 4000; // Reducir estrellas en celular para que vaya más fluido
        const stars = [];

        for (let i = 0; i < starsCount; i++) {
            stars.push(
                (Math.random() - 0.5) * 300,
                (Math.random() - 0.5) * 300,
                (Math.random() - 0.5) * 300
            );
        }

        starsGeometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(stars, 3)
        );

        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.3
        });

        const starsMesh = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starsMesh);

        const sunflower = new THREE.Group();

        const stem = new THREE.Mesh(
            new THREE.CylinderGeometry(0.09, 0.13, 3, 32),
            new THREE.MeshStandardMaterial({ color: 0x3c873c })
        );
        stem.position.y = -1.8;
        sunflower.add(stem);

        const center = new THREE.Mesh(
            new THREE.SphereGeometry(0.7, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0x5b3218 })
        );
        sunflower.add(center);

        const petalMaterial = new THREE.MeshStandardMaterial({
            color: 0xffd447,
            emissive: 0xffa000,
            emissiveIntensity: 0.25
        });

        for (let i = 0; i < 32; i++) {
            const petal = new THREE.Mesh(
                new THREE.SphereGeometry(0.16, 20, 20),
                petalMaterial
            );

            const angle = (i / 32) * Math.PI * 2;
            petal.position.x = Math.cos(angle) * 0.9;
            petal.position.z = Math.sin(angle) * 0.9;
            petal.scale.y = 3;
            petal.rotation.z = angle;

            sunflower.add(petal);
        }

        sunflower.position.y = 3;
        sunflower.scale.set(1.5, 1.5, 1.5);
        scene.add(sunflower);

        const mouse = { x: 0, y: 0 };

        // Soporte tanto para mouse como para movimiento táctil en celular
        window.addEventListener("mousemove", (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener("touchmove", (event) => {
            if (event.touches.length > 0) {
                mouse.x = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
            }
        }, { passive: true });

        const startButton = document.querySelector("#startButton");
        const welcome = document.querySelector("#welcome");
        const letterBox = document.querySelector("#letterBox");
        const letterText = document.querySelector("#letterText");
        const music = document.querySelector("#music");

        const message = `Hola, Noemii<3

Quería dejarte este pequeño detalle.

A veces uno no se da cuenta de lo bonito que es encontrar personas que tienen una pasión por algo que hacen, y me parece muy lindo que hayas elegido un camino donde puedes ayudar y enseñar a otros.

Sé que la carrera de una maestra no siempre debe ser fácil. Habrá días cansados, tareas, nervios y muchos retos, pero también habrá momentos que harán que todo valga la pena.

Nunca pierdas esa ilusión por aprender y por convertirte en la persona que quieres ser.

Espero que algún día puedas mirar atrás y sentirte orgullosa de todo lo que lograste.

Sigue dando lo mejor de ti, porque estoy seguro de que alguien tendrá mucha suerte de tenerte como maestra.

Te deseo muchos éxitos en este camino tkm 🌻✨`;

        let letterIndex = 0;

        function writeLetter() {
            if (letterIndex < message.length) {
                letterText.textContent += message[letterIndex];
                letterIndex++;
                setTimeout(writeLetter, 45);
            }
        }

        startButton.addEventListener("click", () => {
            music.play().catch(() => { });
            welcome.classList.add("hideWelcome");

            const zoom = setInterval(() => {
                camera.position.z -= 0.08;
                if (camera.position.z <= 14) {
                    clearInterval(zoom);
                }
            }, 16);

            setTimeout(() => {
                welcome.style.display = "none";
                letterBox.classList.add("showLetter");
                setTimeout(writeLetter, 700);
            }, 1200);
        });

        function animate() {
            requestAnimationFrame(animate);

            starsMesh.rotation.y += 0.0003;
            sunflower.rotation.y += 0.003;
            sunflower.position.y = 3 + Math.sin(Date.now() * 0.002) * 0.15;

            camera.position.x += (mouse.x * 2 - camera.position.x) * 0.02;
            camera.position.y += (mouse.y * 2 - camera.position.y) * 0.02;

            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

    <audio id="music" loop>
        <source src="../audios/maestra.mp3" type="audio/mpeg">
    </audio>

</body>

</html>
