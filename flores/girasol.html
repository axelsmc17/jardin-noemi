<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Noemy owo</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <!-- Three.js Import Shim & Map -->
    <script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.179.1/build/three.module.js"
        }
    }
    </script>

    <!-- CSS Unificado -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02030a;
            color: white;
            font-family: "Poppins", sans-serif;
        }

        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #overlay {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        #welcome {
            width: 90%;
            max-width: 800px;
            text-align: center;
            transition: 1s ease;
        }

        #welcome h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: 4.5rem;
            font-weight: 600;
            margin-bottom: 25px;
            text-shadow: 0 0 25px rgba(255, 255, 255, .35);
        }

        #welcome p {
            max-width: 600px;
            margin: auto;
            margin-bottom: 40px;
            font-size: 1.15rem;
            line-height: 1.8;
            color: #dddddd;
        }

        button {
            border: none;
            cursor: pointer;
            padding: 16px 45px;
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffd54f, #ff9800);
            box-shadow: 0 0 35px rgba(255, 190, 0, .45);
            transition: .35s;
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 0 70px rgba(255, 200, 0, .7);
        }

        button:active {
            transform: scale(.95);
        }

        #letterBox {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: 1s ease;
        }

        .card {
            width: min(750px, 90%);
            padding: 50px;
            border-radius: 35px;
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .15);
            box-shadow: 0 0 60px rgba(0, 0, 0, .5);
            text-align: center;
        }

        .card h2 {
            font-family: "Cormorant Garamond", serif;
            font-size: 3.2rem;
            margin-bottom: 30px;
        }

        #letterText {
            min-height: 260px;
            text-align: left;
            white-space: pre-line;
            font-size: 1.05rem;
            line-height: 2;
            color: #eeeeee;
        }

        .showLetter {
            opacity: 1 !important;
            visibility: visible !important;
        }

        .hideWelcome {
            opacity: 0;
            transform: translateY(-50px);
        }

        @media(max-width:700px) {
            #welcome h1 {
                font-size: 2.8rem;
            }

            #welcome p {
                font-size: .95rem;
            }

            .card {
                padding: 30px;
            }

            .card h2 {
                font-size: 2.2rem;
            }

            #letterText {
                font-size: .95rem;
            }
        }
    </style>
</head>

<body>

    <canvas id="bg"></canvas>

    <div id="overlay">
        <section id="welcome">
            <h1>Para una futura gran maestra</h1>
            <p>Un pequeño detalle para recordarte que los sueños se construyen paso a paso.</p>
            <button id="startButton">Comenzar ✨</button>
        </section>

        <section id="letterBox">
            <div class="card">
                <h2>Para una futura maestra con mucho corazón</h2>
                <p id="letterText"></p>
                <button id="finishButton">Gracias por leer 🌻</button>
            </div>
        </section>
    </div>

    <!-- JavaScript Unificado -->
    <script type="module">
        import * as THREE from "three";

        const canvas = document.querySelector("#bg");
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x02030a);

        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 18;

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const light = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(light);

        const flowerLight = new THREE.PointLight(0xffd27a, 35, 100);
        flowerLight.position.set(0, 5, 5);
        scene.add(flowerLight);

        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 4000;
        const stars = [];

        for (let i = 0; i < starsCount; i++) {
            stars.push(
                (Math.random() - 0.5) * 300,
                (Math.random() - 0.5) * 300,
                (Math.random() - 0.5) * 300
            );
        }

        starsGeometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(stars, 3)
        );

        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.3
        });

        const starsMesh = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starsMesh);

        const sunflower = new THREE.Group();

        const stem = new THREE.Mesh(
            new THREE.CylinderGeometry(0.09, 0.13, 3, 32),
            new THREE.MeshStandardMaterial({ color: 0x3c873c })
        );
        stem.position.y = -1.8;
        sunflower.add(stem);

        const center = new THREE.Mesh(
            new THREE.SphereGeometry(0.7, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0x5b3218 })
        );
        sunflower.add(center);

        const petalMaterial = new THREE.MeshStandardMaterial({
            color: 0xffd447,
            emissive: 0xffa000,
            emissiveIntensity: 0.25
        });

        for (let i = 0; i < 32; i++) {
            const petal = new THREE.Mesh(
                new THREE.SphereGeometry(0.16, 20, 20),
                petalMaterial
            );

            const angle = (i / 32) * Math.PI * 2;
            petal.position.x = Math.cos(angle) * 0.9;
            petal.position.z = Math.sin(angle) * 0.9;
            petal.scale.y = 3;
            petal.rotation.z = angle;

            sunflower.add(petal);
        }

        sunflower.position.y = 3;
        sunflower.scale.set(1.5, 1.5, 1.5);
        scene.add(sunflower);

        const mouse = { x: 0, y: 0 };

        window.addEventListener("mousemove", (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        const startButton = document.querySelector("#startButton");
        const welcome = document.querySelector("#welcome");
        const letterBox = document.querySelector("#letterBox");
        const letterText = document.querySelector("#letterText");
        const music = document.querySelector("#music");

        const message = `Hola, Noemii<3

Quería dejarte este pequeño detalle.

A veces uno no se da cuenta de lo bonito que es encontrar personas que tienen una pasión por algo que hacen, y me parece muy lindo que hayas elegido un camino donde puedes ayudar y enseñar a otros.

Sé que la carrera de una maestra no siempre debe ser fácil. Habrá días cansados, tareas, nervios y muchos retos, pero también habrá momentos que harán que todo valga la pena.

Nunca pierdas esa ilusión por aprender y por convertirte en la persona que quieres ser.

Espero que algún día puedas mirar atrás y sentirte orgullosa de todo lo que lograste.

Sigue dando lo mejor de ti, porque estoy seguro de que alguien tendrá mucha suerte de tenerte como maestra.

Te deseo muchos éxitos en este camino tkm 🌻✨`;

        let letterIndex = 0;

        function writeLetter() {
            if (letterIndex < message.length) {
                letterText.textContent += message[letterIndex];
                letterIndex++;
                setTimeout(writeLetter, 45);
            }
        }

        startButton.addEventListener("click", () => {
            music.play().catch(() => { });
            welcome.classList.add("hideWelcome");

            const zoom = setInterval(() => {
                camera.position.z -= 0.08;
                if (camera.position.z <= 14) {
                    clearInterval(zoom);
                }
            }, 16);

            setTimeout(() => {
                welcome.style.display = "none";
                letterBox.classList.add("showLetter");
                setTimeout(writeLetter, 700);
            }, 1200);
        });

        function animate() {
            requestAnimationFrame(animate);

            starsMesh.rotation.y += 0.0003;
            sunflower.rotation.y += 0.003;
            sunflower.position.y = 3 + Math.sin(Date.now() * 0.002) * 0.15;

            camera.position.x += (mouse.x * 2 - camera.position.x) * 0.02;
            camera.position.y += (mouse.y * 2 - camera.position.y) * 0.02;

            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

    <audio id="music" loop>
        <source src="../audios/maestra.mp3" type="audio/mpeg">
    </audio>

</body>

</html>
