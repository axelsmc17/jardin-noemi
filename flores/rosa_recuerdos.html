<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nenúfar Mágico</title>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050b14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
        }

        #frase-header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #f1f1f1;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
            z-index: 10;
            pointer-events: none;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .escena {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: linear-gradient(to bottom, #02010a, #0b1d3a);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .luna {
            position: absolute;
            top: 60px;
            right: 80px;
            width: 70px;
            height: 70px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 25px 8px rgba(255, 255, 255, 0.4);
        }

        .reflejo-agua {
            position: absolute;
            top: 150px;
            width: 120px;
            height: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            filter: blur(5px);
        }

        .particula {
            position: absolute;
            background-color: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffae00;
            animation: flotar 4s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes flotar {
            0% {
                transform: translateY(0px) translateX(0px);
                opacity: 0;
            }

            50% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-100px) translateX(20px);
                opacity: 0;
            }
        }

        .estanque-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hoja-nenufar {
            position: absolute;
            width: 180px;
            height: 180px;
            background: #1b4332;
            border-radius: 50% 50% 45% 50%;
            box-shadow:
                inset 0 0 15px #081c15,
                0 5px 15px rgba(0, 0, 0, 0.5);
            clip-path: polygon(
                0% 0%,
                100% 0%,
                100% 100%,
                0% 100%,
                45% 50%
            );
        }

        .flor {
            position: absolute;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .centro-flor {
            position: absolute;
            width: 25px;
            height: 25px;
            background: #ffeb3b;
            border-radius: 50%;
            box-shadow: 0 0 10px #fbc02d;
            z-index: 5;
        }

        .petalo {
            position: absolute;
            width: 22px;
            height: 55px;
            background: linear-gradient(to top, #ff758c, #ff7eb3);
            border-radius: 50% 50% 20% 20%;
            transform-origin: bottom center;
            bottom: 30px;
            box-shadow: 0 0 5px rgba(255, 117, 140, 0.5);
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .p1 {
            transform: rotate(0deg) scale(0.6);
        }

        .p2 {
            transform: rotate(45deg) scale(0.6);
        }

        .p3 {
            transform: rotate(90deg) scale(0.6);
        }

        .p4 {
            transform: rotate(135deg) scale(0.6);
        }

        .p5 {
            transform: rotate(180deg) scale(0.6);
        }

        .p6 {
            transform: rotate(225deg) scale(0.6);
        }

        .p7 {
            transform: rotate(270deg) scale(0.6);
        }

        .p8 {
            transform: rotate(315deg) scale(0.6);
        }

        .abierta .flor {
            transform: scale(1.3);
        }

        .abierta .p1 {
            transform: rotate(0deg) translateY(-22px) scaleY(1.1);
        }

        .abierta .p2 {
            transform: rotate(45deg) translateY(-22px) scaleY(1.1);
        }

        .abierta .p3 {
            transform: rotate(90deg) translateY(-22px) scaleY(1.1);
        }

        .abierta .p4 {
            transform: rotate(135deg) translateY(-22px) scaleY(1.1);
        }

        .abierta .p5 {
            transform: rotate(180deg) translateY(-22px) scaleY(1.1);
        }

        .abierta .p6 {
            transform: rotate(225deg) translateY(-22px) scaleY(1.1);
        }

        .abierta .p7 {
            transform: rotate(270deg) translateY(-22px) scaleY(1.1);
        }

        .abierta .p8 {
            transform: rotate(315deg) translateY(-22px) scaleY(1.1);
        }

        @media (max-width: 600px) {
            #frase-header {
                top: 16px;
                font-size: 0.95rem;
                line-height: 1.4;
                padding: 0 20px;
            }

            .luna {
                top: 75px;
                right: 35px;
                width: 55px;
                height: 55px;
                box-shadow: 0 0 20px 6px rgba(255, 255, 255, 0.4);
            }

            .reflejo-agua {
                top: 145px;
                width: 90px;
            }

            .estanque-container {
                transform: scale(0.85);
            }
        }

        @media (max-height: 650px) {
            .estanque-container {
                transform: scale(0.75);
            }

            #frase-header {
                top: 10px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>

    <div id="frase-header">
        ni en las noches mas oscuras dejo de pensar en ti mimi negrita beya &lt;3
    </div>

    <div class="escena" id="escena">

        <div class="luna"></div>

        <div class="reflejo-agua"></div>

        <div class="estanque-container" id="estanque">

            <div class="hoja-nenufar"></div>

            <div class="flor" id="florNenufar">

                <div class="centro-flor"></div>

                <div class="petalo p1"></div>
                <div class="petalo p2"></div>
                <div class="petalo p3"></div>
                <div class="petalo p4"></div>
                <div class="petalo p5"></div>
                <div class="petalo p6"></div>
                <div class="petalo p7"></div>
                <div class="petalo p8"></div>

            </div>

        </div>

    </div>

    <!-- Ruta corregida subiendo un nivel con ../ para salir de la carpeta flores -->
    <audio
        id="audioAmor"
        src="../audios/amor_completo.mp3"
        preload="auto"
        loop>
    </audio>

    <script>
        const escena = document.getElementById('escena');
        const estanque = document.getElementById('estanque');
        const audioAmor = document.getElementById('audioAmor');

        let abierto = false;
        let audioIniciado = false;

        function crearParticulas() {
            for (let i = 0; i < 25; i++) {
                const particula = document.createElement('div');

                particula.classList.add('particula');

                particula.style.left =
                    Math.random() * window.innerWidth + 'px';

                particula.style.top =
                    (
                        window.innerHeight * 0.5 +
                        Math.random() * (window.innerHeight * 0.5)
                    ) + 'px';

                const tamano = Math.random() * 6 + 3;

                particula.style.width = tamano + 'px';
                particula.style.height = tamano + 'px';

                particula.style.animationDuration =
                    (Math.random() * 3 + 2) + 's';

                particula.style.animationDelay =
                    (Math.random() * 2) + 's';

                document.body.appendChild(particula);
            }
        }

        function iniciarMusica() {
            if (audioIniciado) return;

            audioAmor.play()
                .then(() => {
                    audioIniciado = true;
                })
                .catch(error => {
                    console.log(
                        'El navegador bloqueó el audio:',
                        error
                    );
                });
        }

        function interactuar() {
            if (!abierto) {
                estanque.classList.add('abierta');
                iniciarMusica();
                abierto = true;
            } else {
                estanque.classList.remove('abierta');

                audioAmor.pause();
                audioAmor.currentTime = 0;

                audioIniciado = false;
                abierto = false;
            }
        }

        crearParticulas();

        escena.addEventListener(
            'pointerdown',
            interactuar,
            { passive: true }
        );

        document.addEventListener(
            'visibilitychange',
            () => {
                if (document.hidden && !audioAmor.paused) {
                    audioAmor.pause();
                }
            }
        );
    </script>

</body>

</html>
